spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DB:dianfei}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:dianfei}
    password: ${MYSQL_PASSWORD:}
    druid:
      initial-size: 10
      min-idle: 10
      max-active: 50
      max-wait: 60000
      validation-query: SELECT 1
      test-while-idle: true
      stat-view-servlet:
        enabled: false
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 5s

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

dianfei:
  cors:
    allowed-origins: ${DIANFEI_CORS_ALLOWED_ORIGINS:}
  security:
    field-key: ${DIANFEI_FIELD_KEY:}
  jwt:
    secret: ${JWT_SECRET:}
  ai:
    # C14：AI 服务地址/内网 Token 必须经环境变量注入（compose 已映射，见 deploy/docker-compose.yml）
    base-url: ${DIANFEI_AI_BASE_URL:http://ai-service:8100}
    # 内网出站 Token（ai-back AI_INTERNAL_TOKEN 一致）；生产必配，否则启动校验拒绝
    internal-token: ${DIANFEI_AI_INTERNAL_TOKEN:}
    # Python 回调 /api/ai/config/runtime 的 X-Internal-Token（生产必配，空=dev 放行见 AiConfigController）
    config-callback-token: ${DIANFEI_AI_CONFIG_CALLBACK_TOKEN:}
    # 供应商密钥列 AES 密钥（16/24/32 字节；生产必配，空=dev 降级透传见 SensitiveFieldUtil）
    config-aes-key: ${DIANFEI_AI_CONFIG_AES_KEY:}

logging:
  level:
    com.dianfei: info
