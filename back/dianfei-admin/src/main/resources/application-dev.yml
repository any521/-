spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    # dev 约定：MySQL 直接用本机实例（3306），不走 Docker；可用环境变量覆盖
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:dianfei}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    # C7：开发库口令不在配置文件落明文/Q 默认值，必须经环境变量 MYSQL_PASSWORD 注入
    password: ${MYSQL_PASSWORD:}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      validation-query: SELECT 1
      test-while-idle: true
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        # C12：Druid 监控口令经环境变量注入（生产环境 stat-view-servlet.enabled=false，见 application-prod.yml）
        login-username: ${DRUID_LOGIN_USERNAME:druid}
        login-password: ${DRUID_LOGIN_PASSWORD:}
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 5s
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2

logging:
  level:
    com.dianfei: debug
    org.springframework.security: info

# AI 旁路服务（ai-back）：本地启动在 8000 端口（设计端口 8100，按实际启动覆盖）
dianfei:
  file:
    # 本地开发默认本地磁盘（不依赖外部对象存储）；生产经 .env 设 DIANFEI_FILE_STORAGE_TYPE=oss
    # （历史：曾默认 minio，容器已从 deploy/docker-compose.yml 移除，如需本地 MinIO 联调可改回并自行拉起容器）
    storage-type: local
    local-path: ./upload
  security:
    # S-08: 仅本地开发默认值，生产必经环境变量 DIANFEI_FIELD_KEY 注入
    field-key: ${DIANFEI_FIELD_KEY:abcdefjhijklmnop}
  jwt:
    # C6：开发专属随机 secret（仅本地开发使用；生产由 JWT_SECRET 环境变量注入，禁止复用本值）
    # S-08: 仅本地开发默认值，生产必经环境变量 JWT_SECRET 注入
    secret: ${JWT_SECRET:abcdefjhijklmnopqrstuvwxyzabcdefjhijklmnopqrstuvwxyz}
  ai:
    base-url: ${DIANFEI_AI_BASE_URL:http://127.0.0.1:8000}
    internal-token:
    # Python 回调 /api/ai/config/runtime 的 X-Internal-Token（生产必配；空=开发放行）
    config-callback-token:
    # 供应商密钥列 AES 密钥（16/24/32 字节；空=开发降级透传，生产必配）
    config-aes-key:
  auth:
    # V39：验证码改真实邮箱（配置见 application.yml spring.mail）；本地开发如需调试发信可注入 MAIL_USERNAME/MAIL_PASSWORD
