spring:
  datasource:
    driver-class-name: org.h2.Driver
    # MySQL 兼容模式，Track A 系统表由 schema-h2.sql 初始化（含种子数据），无需本地 MySQL
    # 库名带随机后缀：不同 Spring 上下文各自建库，避免种子数据重复插入
    url: jdbc:h2:mem:dianfei-sys-${random.uuid};MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql

mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: assign_id
    banner: false
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.dianfei: info
