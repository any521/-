spring:
  # 单测为轻量上下文，不启用 Actuator 安全管理自动配置（其依赖 HttpSecurity，
  # 与测试启动类排除 SecurityAutoConfiguration 后的上下文冲突）
  autoconfigure:
    exclude:
      - org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration
  datasource:
    driver-class-name: org.h2.Driver
    # MySQL 兼容模式，全部 Track B 表由 schema-h2.sql 初始化，无需本地 MySQL
    url: jdbc:h2:mem:dianfei;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql

mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: assign_id
    banner: false
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.dianfei: info
