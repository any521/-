# 点废成金 v2.0 子路径共存配置（C-O1）
# 供宿主机 agrimind 原生 nginx 使用：在 443/80 server 块内 include 本文件即可
#   include /etc/nginx/dianfei-locations.conf;
# 路径映射：/点废成金（nginx location 匹配的是百分号解码后的 URI，直接写中文原形）
# 磁盘布局：镜像 URL 结构（root 模式下 $uri 带前缀，index/SPA 回退天然自洽）
#   /srv/dianfei/user/点废成金/...        ← front-user dist
#   /srv/dianfei/staff/点废成金/staff/...  ← front-staff dist
#   /srv/dianfei/admin/点废成金/admin/...  ← front dist
# 后端反代：127.0.0.1:8081（back 容器回环端口，见 docker-compose.yml back.ports）
# 前置依赖：http 上下文需定义 map（见 conf.d/00-dianfei-map.conf，若全局已有可跳过）

# ---------- 目录 URL 规范化：无尾斜杠 301 补斜杠（避免落入 agrimind 兜底导致劫持） ----------
location = /点废成金 { return 301 /点废成金/; }
location = /点废成金/staff { return 301 /点废成金/staff/; }
location = /点废成金/admin { return 301 /点废成金/admin/; }

# ---------- IM WebSocket 长连接（升级头 + 长超时，剥前缀反代） ----------
location /点废成金/api/ws/ {
    proxy_pass http://127.0.0.1:8081/api/ws/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# ---------- 后端 API（剥离子路径前缀反代 back 容器回环端口） ----------
location /点废成金/api/ {
    proxy_pass http://127.0.0.1:8081/api/;
    # IM 视频上传上限 500MB（与后端 multipart max-request-size 对齐，覆盖宿主机全局 110m）
    client_max_body_size 500m;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 60s;
}

# ---------- 接口文档（可选） ----------
location ~ ^/点废成金/(doc\.html|webjars/|v3/api-docs)(.*)$ {
    proxy_pass http://127.0.0.1:8081/$1$2;
    proxy_set_header Host $host;
}

# ---------- 管理后台（front/dist，base=/点废成金/admin/） ----------
location /点废成金/admin/ {
    root /srv/dianfei/admin;
    try_files $uri $uri/ /点废成金/admin/index.html;
}

# ---------- 员工端（front-staff/dist，base=/点废成金/staff/） ----------
location /点废成金/staff/ {
    root /srv/dianfei/staff;
    try_files $uri $uri/ /点废成金/staff/index.html;
}

# ---------- 用户端 H5（front-user/dist，base=/点废成金/；COOP/COEP 与独立容器版一致） ----------
location /点废成金/ {
    # 卡顿修复 B：仅用户端开跨域隔离（端侧 AR 推理 WASM 多线程需要）
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy credentialless always;
    root /srv/dianfei/user;
    try_files $uri $uri/ /点废成金/index.html;
}
