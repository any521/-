# 点废成金 v2.0 构建校验（A5）：后端 mvn package + 前端 build
# 仓库推送到 GitHub 后自动生效；如用 GitLab 可等价迁移为 .gitlab-ci.yml
name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  backend:
    name: 后端 mvn package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: 构建（跳过测试网速优先，单测在 test job 补跑）
        working-directory: back
        run: mvn -B clean package -DskipTests
      - name: 单元测试
        working-directory: back
        run: mvn -B test

  frontend-admin:
    name: 管理后台 build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: npm
          cache-dependency-path: front/package-lock.json
      - name: 安装依赖
        working-directory: front
        run: npm ci
      - name: 类型检查 + 构建
        working-directory: front
        run: npm run build

  ai-service:
    name: AI 服务依赖安装 + 冒烟
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-back/requirements.txt
      - name: 安装依赖
        working-directory: ai-back
        run: pip install -r requirements.txt
      - name: 导入冒烟（应用可加载即通过）
        working-directory: ai-back
        run: python -c "import main"
